<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgAuto.</title>

    <!-- Preconnect hints: these tell the browser to start the DNS lookup
         + TLS handshake for these origins immediately, in parallel with
         parsing the page, instead of waiting until the first request to
         each one is actually discovered (e.g. the first product image,
         or the first API call). Saves ~100-300ms per origin depending on
         the user's connection, and it's essentially free. -->
    <link rel="preconnect" href="%VITE_BACKEND_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
